<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Knowledge Hub Capture</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, sans-serif;
        }

        body {
            width: 320px;
            margin: 0;
            padding: 16px;
            background: #171717;
            color: #f5f5f5;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 16px;
            font-weight: 600;
        }

        p {
            margin: 0 0 12px;
            font-size: 12px;
            line-height: 1.4;
            color: #c7c7c7;
            white-space: pre-line;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            margin: 0 0 12px;
            padding: 10px 12px;
            box-sizing: border-box;
            border: 1px solid #3d3d3d;
            border-radius: 10px;
            background: #111111;
            color: inherit;
            resize: vertical;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 10px 12px;
            background: #f1f1f1;
            color: #111111;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .status {
            min-height: 18px;
            margin-top: 10px;
            font-size: 12px;
            color: #c7c7c7;
        }
    </style>
</head>
<body>
    <h1>Save to Knowledge Hub</h1>
    <p id="page-meta">Loading current page…</p>
    <textarea id="annotation" placeholder="Add a short note or annotation"></textarea>
    <button id="save-button" type="button">Save</button>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <script type="module" src="popup.js"></script>
</body>
</html>
